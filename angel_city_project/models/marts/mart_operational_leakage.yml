---
version: 2
models:
  - name: mart_operational_leakage
    description: |
      Operational reporting mart that identifies completed encounters
      without associated insurance claims, supporting revenue leakage analysis.
    columns:
      - name: encounter_id
        description: Unique encounter identifier.
        tests: 
          - unique
          - not_null
      - name: patient_id
        description: Patient identifier.
      - name: provider_id
        description: Provider identifier.
      - name: encounter_class
        description: Encounter classification.
      - name: encounter_end_timestamp
        description: Encounter completion timestamp.
      - name: estimated_billable_amount
        description: Estimated revenue associated with the missing claim.
