---
version: 2
models:
  - name: stg_claims
    description: Standardized insurance claims extracted from the raw claims dataset.
    columns:
      - name: claim_id
        description: Unique identifier for each insurance claim.
        tests: 
          - unique
          - not_null
      - name: encounter_id
        description: Encounter associated with the insurance claim.
      - name: payer_id
        description: Identifier of the insurance payer.
      - name: total_billed_amount
        description: Total amount billed to the insurance provider.
      - name: amount_paid_by_insurance
        description: Amount paid by the insurance provider.
      - name: patient_responsibility_amount
        description: Amount the patient is responsible for paying.
      - name: claim_status
        description: Current processing status of the insurance claim.
      - name: processed_date
        description: Date on which the claim was processed.
      - name: denial_reason
        description: Reason the claim was denied, if applicable.
      - name: reimbursement_rate
        description: Percentage of the billed amount reimbursed by the insurance provider.
      - name: source_file_name
        description: Source S3 file.
      - name: file_row_number
        description: Original row number within the source file.
      - name: file_last_modified
        description: Last modification timestamp of the source file.
      - name: load_timestamp
        description: Timestamp when the record was loaded into Snowflake.
